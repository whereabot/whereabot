<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option 10: Icon grid + detail</title>
<link rel="stylesheet" href="site/css/landing-page.css">
<link rel="stylesheet" href="options.css">
<style>
.ig { display: grid; gap: var(--space-3); }
.ig-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); }
.ig-grid .card-label { grid-column: 1 / -1; margin-top: var(--space-1); }
.it { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); aspect-ratio: 1; min-height: var(--size-touch-large);
  border: var(--border-thin) solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold); line-height: var(--leading-tight); cursor: pointer; box-shadow: var(--shadow-raised); }
.it .ico-lg { color: var(--color-accent-text); }
.it[aria-selected="true"] { border: var(--border-thick) solid var(--color-accent); background: var(--color-accent-soft); }
.pip { position: absolute; top: var(--space-1); right: var(--space-1); padding: 0 var(--space-1); border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-on-accent); font-size: .65rem; font-style: normal; }
.pip-off { background: var(--color-surface-sunken); color: var(--color-text-muted); }
.ig-pane h3 { font-size: var(--text-lg); }
.ig-pane { min-height: 13rem; }
#install-help[hidden] { display: none; }
@media (min-width: 50rem) {
  .ig { grid-template-columns: 26rem 1fr; gap: var(--space-6); align-items: start; }
  .it { font-size: var(--text-sm); }
}</style>
<script type="module" src="copy-anywhere.js"></script>
<script type="module" src="site/js/landing-install-help.js"></script>
<script type="module">
const pane = document.getElementById("pane"), help = document.getElementById("install-help");
const tpl = Object.fromEntries([...pane.querySelectorAll("template")].map((t) => [t.dataset.k, t]));
const tiles = [...document.querySelectorAll(".it")];
function show(k) { tiles.forEach((t) => t.setAttribute("aria-selected", t.dataset.k === k));
  for (const n of [...pane.childNodes]) if (n.nodeName !== "TEMPLATE") n.remove();
  pane.append(tpl[k].content.cloneNode(true));
  const slot = pane.querySelector(".install-slot"); if (slot) slot.append(help); help.hidden = !slot;
  window.wbCopy?.(pane); }
tiles.forEach((t) => (t.onclick = () => show(t.dataset.k)));
help.hidden = true;
// Install help is built async by landing-install-help.js; start once it exists.
setTimeout(() => show("url"), 0);</script>
</head>
<body>
<main id="main">
<section id="start" aria-labelledby="start-title" data-option="10" data-name="Icon grid + detail" data-states='["[data-k=\"cc\"]","[data-k=\"web\"]"]'>
  <h2 id="start-title">Get started</h2>
  <p class="lede">You need both: your agent asks, your phone answers.</p>

<div class="ig">
  <div class="ig-grid" role="tablist" aria-label="Get started">
    <p class="card-label g1">1 · Your agent</p>
    <button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="url"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg><span>Relay URL</span></button><button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="cc"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span>Claude Code</span></button><button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="ai"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>Claude.ai</span></button><button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="other"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg><span>Other MCP</span></button>
    <p class="card-label g2">2 · Your device</p>
    <button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="ios"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg><span>iPhone</span><i class="pip">Best</i></button><button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="web"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Browser</span></button><button type="button" class="it" role="tab" aria-selected="false" aria-controls="pane" data-k="android"><svg class="ico ico-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg><span>Android</span><i class="pip pip-off">Soon</i></button>
  </div>
  <div class="card ig-pane" id="pane" role="tabpanel">
    <template data-k="url"><h3>Relay URL</h3><div class="copy-row"><code class="code-block" data-copy>https://relay.whereabot.io/mcp</code></div><p class="sub">You sign in in the browser (OAuth). No API keys. Use the same Google account as on your phone. <a href="docs/getting-started">More in the docs</a>.</p></template>
    <template data-k="cc"><h3>Claude Code</h3><div class="copy-row"><code class="code-block" data-copy>claude mcp add --transport http whereabot https://relay.whereabot.io/mcp</code></div><p class="sub">Then run <code>/mcp</code> and sign in. Use the same Google account as on your phone.</p></template>
    <template data-k="ai"><h3>Claude.ai and Claude Desktop</h3><p class="sub">Settings → Connectors → Add custom connector. Paste the relay URL, then sign in.</p><div class="copy-row"><code class="code-block" data-copy>https://relay.whereabot.io/mcp</code></div></template>
    <template data-k="other"><h3>Other MCP clients</h3><p class="sub">Add the relay URL as a streamable HTTP server. The client opens the sign-in page.</p><div class="copy-row"><code class="code-block" data-copy>https://relay.whereabot.io/mcp</code></div></template>
    <template data-k="ios"><h3 class="label-row">App Store (iPhone) <span class="badge is-accent">Recommended</span></h3><p class="sub">Answers in the background. In beta.</p><a class="btn btn-primary" href="#app-store"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg> Get it on the App Store</a></template>
    <template data-k="web"><h3>Use in your browser</h3><p class="sub">Answers after you tap the notification.</p><a class="btn btn-primary btn-small" href="app/">Open the browser app</a><div class="install-slot"></div><p class="note"><a href="docs/install-from-browser">Install from the browser</a>: steps and limits.</p></template>
    <template data-k="android"><h3 class="label-row">Google Play <span class="badge">Coming soon</span></h3><p class="sub">Until then, use the browser app on Android.</p></template>
  </div>
  <div id="install-help"></div>
</div>
</section>
</main>
</body>
</html>
