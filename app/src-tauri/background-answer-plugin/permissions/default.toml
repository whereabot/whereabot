"$schema" = "schemas/schema.json"

[default]
description = "Every background-answer command: session hand-off, settings, always-allowed list, automatic answers, Always location permission."
permissions = [
  "allow-configure",
  "allow-save-session",
  "allow-load-session",
  "allow-remove-session",
  "allow-device-id",
  "allow-reset-device-id",
  "allow-take-always-allowed",
  "allow-take-auto-shared",
  "allow-location-authorization",
  "allow-request-always-location",
]
