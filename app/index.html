<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/layout.css" />
    <link rel="stylesheet" href="/src/buttons.css" />
    <link rel="stylesheet" href="/src/components.css" />
    <title>Whereabot</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="page">
      <header class="brand">
        <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
          <path fill="#2F5BEA" d="M64 122C64 122 26 86 26 52A38 38 0 0 1 102 52C102 86 64 122 64 122Z" />
          <circle fill="#FFFFFF" cx="64" cy="35" r="3.5" />
          <path fill="#FFFFFF" d="M64 40C52 40 47 48 47 58L43 68H85L81 58C81 48 76 40 64 40Z" />
          <rect fill="#FFFFFF" x="41" y="66" width="46" height="5" rx="2.5" />
          <circle fill="#FFB020" cx="64" cy="77" r="4.5" />
        </svg>
        <span class="brand-name">Whereabot</span>
      </header>

      <p class="lede">Your AI agent can ask this phone where you are. Only when it asks. Nothing is stored.</p>

      <section id="state-card" class="card status-card" data-state="disconnected" aria-labelledby="state-label">
        <p class="card-label">Status</p>
        <p id="state-label" class="state-label">Disconnected</p>
        <p id="status" class="status-text" role="status" aria-live="polite"></p>
      </section>

      <section id="signed-out" class="stack">
        <button id="google-sign-in" class="btn btn-google" type="button">
          <svg class="google-g" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Sign in with Google
        </button>
        <form id="dev-form" class="stack" hidden>
          <label for="dev-email">Email</label>
          <input id="dev-email" type="email" autocomplete="username" required />
          <label for="dev-password">Password</label>
          <input id="dev-password" type="password" autocomplete="current-password" required />
          <button class="btn btn-secondary" type="submit">Sign in with email (dev)</button>
        </form>
      </section>

      <section id="signed-in" class="stack" hidden>
        <div class="actions">
          <button id="connect" class="btn btn-primary" type="button">Connect</button>
          <button id="disconnect" class="btn btn-secondary" type="button">Disconnect</button>
        </div>
        <p id="last-ping" class="muted"></p>

        <aside class="help" aria-labelledby="help-title">
          <p id="help-title" class="help-title">Connect your agent</p>
          <p>Add the relay URL in your agent and sign in there. No keys needed.</p>
        </aside>

        <button id="sign-out" class="btn btn-ghost" type="button">Sign out</button>
      </section>
    </main>
  </body>
</html>
