<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whereabouts</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Whereabouts</h1>
      <p>Lets your AI agent ask this phone where it is.</p>

      <form id="pair-form">
        <label for="server">Relay URL</label>
        <input id="server" type="url" placeholder="wss://relay.example.com" required />
        <label for="token">Device token</label>
        <input id="token" type="password" autocomplete="off" required />
        <button type="submit">Connect</button>
      </form>
      <button id="disconnect" type="button">Disconnect</button>

      <p id="status" role="status" aria-live="polite">Not connected</p>
      <p id="last-ping"></p>
    </main>
  </body>
</html>
