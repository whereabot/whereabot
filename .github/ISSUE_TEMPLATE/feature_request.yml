name: Feature request
description: Suggest an idea. Check the roadmap first.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Planned work: [roadmap](https://github.com/whereabot/whereabot/blob/main/docs/roadmap.md)."
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what stops you today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: privacy
    attributes:
      label: Privacy impact
      description: Does it store or expose location or personal data? See docs/privacy.md.
