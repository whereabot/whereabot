name: ci
# workflow_call: deploy, migrations and site-cloudflare-deploy run this first and deploy only if it passes.
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test "src/**/*.test.ts"
      - run: npm run lint
      - run: npm run build
  app-no-scroll:
    # Every app screen at phone, tablet and desktop sizes: the page never scrolls (scripts/screens/app-no-scroll-check.mjs).
    runs-on: ubuntu-latest
    env: { NODE_PATH: /tmp/pw/node_modules }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
        working-directory: app
      - run: npm i --prefix /tmp/pw playwright@1.64.0 && /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/screens/app-no-scroll-check.mjs "$RUNNER_TEMP/no-scroll"
      # PWA smoke: manifest, worker, content-hashed icon URLs (fake config; every outside request is refused).
      - run: npm run build:web
        working-directory: app
        env: { VITE_SUPABASE_URL: "https://fake-project.supabase.co", VITE_SUPABASE_ANON_KEY: fake-anon-key, VITE_RELAY_URL: "wss://relay.invalid" }
      - run: node scripts/pwa-install-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: no-scroll-screens, path: "${{ runner.temp }}/no-scroll" }
  linecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo install linecheck --locked --version 1.2.1
      - run: linecheck .
  brand-assets-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci
        working-directory: scripts
      - run: npm ci
        working-directory: app
      - run: node scripts/generate-brand-assets.mjs --check
