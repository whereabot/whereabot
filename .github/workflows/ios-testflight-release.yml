# Deploy only: tag app-vX.Y.Z builds the iOS app and uploads it to TestFlight. Tests run locally.
# Release steps: scripts/release-app-version.sh. One-time setup: environment "testflight".
name: ios-testflight-release
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch: # run it on an app-v* tag ref
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    # macos-26 ships Xcode 26.6 (iOS 26 SDK); App Store Connect requires the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    defaults: { run: { shell: bash } }
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
      # Tauri turns these three into xcodebuild -allowProvisioningUpdates -authenticationKey*.
      APPLE_API_KEY: ${{ vars.ASC_KEY_ID }}
      APPLE_API_ISSUER: ${{ vars.ASC_ISSUER_ID }}
      IPA: app/src-tauri/gen/apple/build/arm64/Whereabot.ipa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag version must equal the three manifests
        run: |
          [[ "$GITHUB_REF" == refs/tags/app-v* ]] || { echo "::error::run on an app-v* tag"; exit 1; }
          want="${GITHUB_REF_NAME#app-v}"
          got=(
            "$(jq -r .version app/package.json)"
            "$(jq -r .version app/src-tauri/tauri.conf.json)"
            "$(sed -nE 's/^version = "(.*)"/\1/p' app/src-tauri/Cargo.toml | head -1)"
          )
          for g in "${got[@]}"; do
            [[ "$g" == "$want" ]] || { echo "::error::tag $want vs manifests ${got[*]}"; exit 1; }
          done
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with: { workspaces: app/src-tauri }
      - name: Write public build config and the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}"
            echo "VITE_RELAY_URL=${{ vars.RELAY_URL }}"
          } > app/.env.production.local
          # altool reads AuthKey_<id>.p8 from API_PRIVATE_KEYS_DIR; Tauri reads APPLE_API_KEY_PATH.
          key="$RUNNER_TEMP/asc/AuthKey_$APPLE_API_KEY.p8"
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/asc" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build and sign the IPA
        working-directory: app
        run: npx tauri ios build --export-method app-store-connect
      - name: IPA has production push and the tag version
        run: |
          d="$RUNNER_TEMP/ipa"; mkdir -p "$d"; unzip -q "$IPA" -d "$d"
          app=("$d"/Payload/*.app)
          codesign -d --entitlements :- "${app[0]}" > "$d/ent.plist"
          aps=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" "$d/ent.plist")
          ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${app[0]}/Info.plist")
          [[ "$aps" == production ]] || { echo "::error::aps-environment is '$aps'"; exit 1; }
          [[ "$ver" == "${GITHUB_REF_NAME#app-v}" ]] || { echo "::error::CFBundleVersion is '$ver'"; exit 1; }
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          if ! xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" 2>&1 | tee "$RUNNER_TEMP/altool.log"; then
            if grep -qiE 'duplicate|already been used|bundle version must be higher' "$RUNNER_TEMP/altool.log"; then
              echo "::error::DUPLICATE build version: TestFlight has this version. Bump with scripts/release-app-version.sh and tag again."
            fi
            exit 1
          fi
      - name: Delete the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" app/.env.production.local
