# Applies supabase/migrations to the branch's environment after full CI passes (map: docs/operations.md#delivery-is-gitops).
name: migrations
on:
  push:
    branches: [dev, main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: migrations-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  push:
    needs: ci
    runs-on: ubuntu-latest
    # The environment's deployment branch policy rejects any other branch.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
