# GitOps for the landing page, docs and the browser app at /app (one Worker): full CI, build docs and app, fill consent config, deploy the "whereabouts" Worker, smoke-test.
name: site-cloudflare-deploy
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "design-system/**"
      - "docs/**"
      - "docs-site/**"
      - "server/src/mcp_location_tool.rs"
      - "server/src/relay_wire_protocol.rs"
      - "README.md"
      - "app/src/**"
      - "app/public/**"
      - "app/index.html"
      - "app/package*.json"
      - ".github/workflows/site-cloudflare-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-cloudflare-deploy
  cancel-in-progress: false
env:
  SITE_URL: https://whereabot.io
  RELAY_URL: wss://relay.whereabot.io
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    # Idle until the Cloudflare settings exist (infra/README.md).
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Build the docs (reference pages come from the relay code)
        working-directory: docs-site
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f .vitepress/dist/index.html
      - name: Build the browser app (PWA, served at /app)
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_RELAY_URL: ${{ env.RELAY_URL }}
          # Optional: empty builds an app without Web Push (infra/README.md, "Add the VAPID key").
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${VITE_SUPABASE_URL:?set environment var SUPABASE_URL}" "${VITE_SUPABASE_ANON_KEY:?set environment var SUPABASE_ANON_KEY}"
          npm ci
          npm run build:web
          test -f dist-web/index.html -a -f dist-web/sw.js -a -f dist-web/app.webmanifest
      - name: Stage site in a fresh temp dir and fill supabase-config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?set environment var SUPABASE_URL}" "${SUPABASE_ANON_KEY:?set environment var SUPABASE_ANON_KEY}"
          STAGE=$(mktemp -d)
          cp -R site "$STAGE/site"
          # Landing and consent link design-system/*.css; only the stylesheets ship (no gallery page).
          mkdir "$STAGE/site/design-system"
          cp design-system/*.css "$STAGE/site/design-system/"
          test -f "$STAGE/site/design-system/design-system.css"
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g; s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" "$STAGE/site/oauth/consent/supabase-config.js"
          if grep -rEn '__[A-Z0-9_]+__' "$STAGE/site"; then echo "unfilled placeholder" >&2; exit 1; fi
          # After the placeholder check: the docs bundle contains names like __VP_HASH_MAP__.
          cp -R docs-site/.vitepress/dist "$STAGE/site/docs"
          cp -R app/dist-web "$STAGE/site/app"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
      - name: Deploy from the empty stage dir (wrangler 4 publishes cwd otherwise)
        working-directory: ${{ env.STAGE }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.154.0 deploy --name whereabouts --assets ./site --domains whereabot.io --compatibility-date 2026-10-01 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          grep -E "Read [0-9]+ files? from the assets directory ${STAGE}/site" "$RUNNER_TEMP/wrangler.log"
      - name: Smoke test
        run: |
          set -euo pipefail
          for p in / /docs/ /docs/reference/mcp-tools /oauth/consent/ /app/ /app/sw.js /app/app.webmanifest; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors "$SITE_URL$p")
            echo "$p -> $code"; [ "$code" = 200 ]
          done
          curl -sI "$SITE_URL/" | grep -i '^content-security-policy:'
          curl -sI "$SITE_URL/docs/" | grep -i "^content-security-policy:.*script-src 'self';"
          curl -sI "$SITE_URL/app/" | grep -i "^permissions-policy:.*geolocation=(self)"
