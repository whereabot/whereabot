# Deploy only: tag app-vX.Y.Z builds the signed Android AAB and uploads it to Google Play internal testing.
# Without the Play secrets the AAB is still built and kept as a run artifact. Tests run locally.
# Release steps: scripts/release-app-version.sh. One-time setup: environment "google-play" with secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
name: android-play-release
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "app-vX.Y.Z tag to release (empty = build the selected ref, no Play upload)"
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        description: "app-vX.Y.Z tag to release"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: android-play-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: google-play
    defaults: { run: { shell: bash } }
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '') }}
      AAB: app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: Tag version must equal the three manifests
        if: env.TAG != ''
        run: |
          [[ "$TAG" == app-v* ]] || { echo "::error::tag '$TAG' is not app-v*"; exit 1; }
          want="${TAG#app-v}"
          got=(
            "$(jq -r .version app/package.json)"
            "$(jq -r .version app/src-tauri/tauri.conf.json)"
            "$(sed -nE 's/^version = "(.*)"/\1/p' app/src-tauri/Cargo.toml | head -1)"
          )
          for g in "${got[@]}"; do
            [[ "$g" == "$want" ]] || { echo "::error::tag $want vs manifests ${got[*]}"; exit 1; }
          done
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
        with: { workspaces: app/src-tauri }
      - name: Write public build config and the upload keystore
        id: setup
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}"
            echo "VITE_RELAY_URL=${{ vars.RELAY_URL }}"
          } > app/.env.production.local
          # The runner image ships the NDK; Tauri reads NDK_HOME.
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          signed=false
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            # app/build.gradle.kts reads the release keystore from ~/.whereabouts/keystore.properties.
            mkdir -p ~/.whereabouts
            base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > ~/.whereabouts/upload.jks
            {
              echo "storeFile=$HOME/.whereabouts/upload.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } > ~/.whereabouts/keystore.properties
            signed=true
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the AAB is unsigned and is not uploaded to Play."
          fi
          play=false
          if [[ "$signed" == true && -n "$PLAY_SERVICE_ACCOUNT_JSON" && -n "$TAG" ]]; then play=true; fi
          [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]] || echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set: no Play upload."
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"
      - name: Build the release AAB
        working-directory: app
        run: npx tauri android build --aab --ci
      - name: AAB is signed and has the tag version
        if: steps.setup.outputs.signed == 'true'
        run: |
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::AAB is not signed"; exit 1; }
          if [[ -n "$TAG" ]]; then
            name=$(grep -E '^tauri.android.versionName=' app/src-tauri/gen/android/app/tauri.properties | cut -d= -f2)
            [[ "$name" == "${TAG#app-v}" ]] || { echo "::error::versionName is '$name'"; exit 1; }
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whereabot-android-${{ env.TAG || github.sha }}
          path: ${{ env.AAB }}
          if-no-files-found: error
      - name: Upload to Google Play internal testing
        if: steps.setup.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.whereabot.app
          releaseFiles: ${{ env.AAB }}
          track: internal
          # A Play app that was never published accepts only draft releases.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Delete the keystore
        if: always()
        run: rm -rf ~/.whereabouts app/.env.production.local
