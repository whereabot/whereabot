# GitOps for the relay: full CI, build once, apply the branch's environment (map: docs/operations.md#delivery-is-gitops).
name: deploy
on:
  push:
    branches: [dev, main]
    paths: ["server/**", "infra/**"]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Rollback: deploy this already-pushed image tag instead of building HEAD"
        required: false
permissions:
  contents: read
  id-token: write
env:
  # The image job builds it; tofu reads it as var.image. Registry names: infra/modules/whereabouts/registry.tf.
  TF_VAR_image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/${{ github.ref_name == 'main' && 'whereabouts-prod' || 'whereabouts' }}/relay:${{ inputs.image_sha || github.sha }}
jobs:
  ci:
    # Full CI on this commit; a rollback skips it (the image was tested when it was built).
    if: ${{ !inputs.image_sha }}
    uses: ./.github/workflows/ci.yml
  image:
    needs: ci
    # Idle until the one-time bootstrap sets WIF_PROVIDER (infra/README.md).
    if: ${{ !inputs.image_sha && vars.WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: gcloud auth configure-docker "${TF_VAR_image%%/*}" --quiet
      - run: docker build --platform linux/amd64 -t "$TF_VAR_image" server
      - run: docker push "$TF_VAR_image"
  apply:
    needs: [ci, image]
    # Run when ci and image were skipped (rollback); never when either failed.
    if: ${{ !cancelled() && !failure() && vars.WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    # The environment's deployment branch policy rejects any other branch.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    concurrency: { group: "deploy-${{ github.ref_name }}", cancel-in-progress: false }
    env:
      TF_DIR: infra/envs/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      TF_VAR_gcp_project: ${{ vars.GCP_PROJECT }}
      TF_VAR_supabase_organization_id: ${{ vars.SUPABASE_ORGANIZATION_ID }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - run: tofu -chdir="$TF_DIR" init -input=false
      - run: tofu -chdir="$TF_DIR" plan -input=false -out=tfplan
      - run: tofu -chdir="$TF_DIR" apply -input=false tfplan
