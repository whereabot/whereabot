# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json

rules:
  # Ratchet: lower error step by step (186 -> 150 -> 120 -> 100, done). Never raise it.
  - pattern: "**/*"
    warn: 90
    error: 100
    error_message: "Split this file by responsibility. Target is 100 lines (ratchet: see linecheck.yml)"

exclude:
  - "**/target/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.lock"
  - "**/package-lock.json"
  - "**/Cargo.lock"
  - "app/src-tauri/gen/**"
  # Written by tauri-plugin's build script (see the plugin's .gitignore).
  - "app/src-tauri/background-answer-plugin/.tauri/**"
  - "app/src-tauri/background-answer-plugin/ios/.build/**"
  - "app/src-tauri/background-answer-plugin/permissions/autogenerated/**"
  - "app/src-tauri/background-answer-plugin/permissions/schemas/**"
  - "app/src-tauri/icons/**"
  - "**/*.png"
  - "**/*.ico"
  - "**/*.icns"
  - "supabase/config.toml"
  - "site/oauth/consent/supabase.esm.mjs"
  - "**/.terraform/**"
  - "**/.terraform.lock.hcl"
  - "LICENSE"
  - ".claude/**"
  - "docs-site/generated-source/**"
  - "docs-site/.vitepress/cache/**"
