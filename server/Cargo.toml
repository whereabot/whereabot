[package]
name = "whereabouts-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
tokio-tungstenite = "0.30.0"
